<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Get Riddlemaster</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/onboarding.css">
  <script type="importmap" nonce="IMPORT_NONCE">{"imports":{"@animocabrands/minds-connect":"/vendor/minds-connect.js","@animocabrands/minds-client-lib":"/vendor/minds-client.js"}}</script>
  <script type="module" src="/onboarding.js"></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="/">RIDDLEMASTER<span aria-hidden="true">.</span></a><button id="sign-out" hidden>Sign out</button></header>
  <main class="onboarding">
    <section class="welcome" aria-labelledby="welcome-title">
      <span class="eyebrow">YOUR PUZZLE PARTNER</span>
      <h1 id="welcome-title">Follow the clue.</h1>
      <p>Get your own investigator.<br>Bring a puzzle. Explore the possibilities.</p>
      <button id="connect" class="primary" disabled>Create my Riddlemaster</button>
      <p id="status" class="quiet" role="status" aria-live="polite">Getting ready…</p>
      <div id="result" hidden><p id="mind-name"></p><a id="open-mind" class="primary-link" target="_blank" rel="noopener noreferrer">Open Mind</a></div>
    </section>
  </main>
</body>
</html>
